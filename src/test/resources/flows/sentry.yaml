id: sentry
namespace: io.kestra.tests

inputs:
  - id: url
    type: STRING
    defaults: "http://localhost:59443"

tasks:
  - id: sentry
    type: io.kestra.plugin.sentry.SentryExecution
    dsn: "{{ inputs.url }}/webhook-unit-test"
    level: ERROR
    serverName: "{{ inputs.url }}"
    platform: JAVA
    executionId: "{{trigger.executionId}}"
    customMessage: "Custom failure message for Sentry"
    customFields:
      environment: "production"
      team: "sre-core"
    extra:
      title: "Kestra Sentry alert"
      service: "Failed on task `failed`"

triggers:
  - id: on_failure
    type: io.kestra.plugin.core.trigger.Flow
    preconditions:
      id: flow_trigger
      flows:
        - namespace: io.kestra.tests
          flowId: main-flow-that-fails
          states: [ FAILED ]
